name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/lint.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/aislop.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/security.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main
  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/standard.yml@a3fa103205245dc7503cafd6c32004c1a637339d # repo-standard main

  # Required check. Every repository defines `just test`; replace the step below
  # with the repository test command when the generic task runner call is not enough.
  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Test
        run: just test
